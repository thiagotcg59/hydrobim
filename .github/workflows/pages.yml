name: Publicar editor

# Compila o editor (tudo roda no navegador, sem a API) e publica em
# https://thiagotcg59.github.io/hydrobim/ a cada atualização da main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O site fica em /hydrobim/, não na raiz do domínio.
      - run: npm run build --workspace @hydrobim/web -- --base=/hydrobim/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
