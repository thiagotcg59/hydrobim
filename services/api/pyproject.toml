[project]
name = "hydrobim-api"
version = "0.1.0"
description = "Validação de projetos hidráulicos HydroBIM — fundação das Fases 0/1."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hydrobim_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
